# yaml-language-server: $schema=../../layers.schema.json

metadata:
  title: { nb: Mineralleting, en: Mineral exploration }
  description:
    nb: Berggrunn, mineralressurser og arealtilgang for leting etter mineraler.
    en: Bedrock, mineral resources and land access for mineral exploration.
  languages: [nb, en]

map:
  # EPSG:3857 only: background-osm below is served as slippy-map tiles, a
  # scheme cut for that CRS and no other, and reprojecting pre-rendered tiles
  # client-side would resample them — the same reason a WMTS background only
  # renders where its own TileMatrixSet declares a CRS.
  crs: [EPSG:3857]
  defaultCrs: EPSG:3857
  center: [14.5, 66.0]
  # Web Mercator metres are inflated ~2.5x at this latitude, so the number that
  # framed Norway on the UTM grids no longer does. This is 1200 ground m/px.
  resolution: 2950
  # OSM's deepest tiles (zoom 19) come to ~1:434 of ground scale here; below it
  # the tiles are only upscaled. Latitude-dependent, unlike the UTM grids this
  # used to sit on. Rounded inwards.
  minScale: 440
  maxScale: 77000000

groups:
  - id: berggrunn
    title: { nb: Berggrunn, en: Bedrock }
  - id: mineralressurser
    title: { nb: Mineralressurser, en: Mineral resources }
  - id: arealtilgang
    title: { nb: Arealtilgang, en: Land access }
  - id: reindrift
    title: { nb: Reindrift, en: Reindeer husbandry }
    parent: arealtilgang

layers:
  # The bottom of the stack: not switchable, and never answers a click.
  - id: background-osm
    type: xyz
    category: background
    title: { nb: OpenStreetMap, en: OpenStreetMap }
    source:
      # OSM's own tiles. Their usage policy is aimed at modest traffic, so a
      # deployed portal wants a commercial provider or self-hosted tiles —
      # which is a URL change here and nothing else.
      url: https://tile.openstreetmap.org/{z}/{x}/{y}.png
      attributions: "© OpenStreetMap contributors"
      maxZoom: 19

  - id: bedrock-surfaces
    type: wms
    category: plane
    title:
      nb: Berggrunn – flater
      en: Bedrock – surfaces
    group: berggrunn
    defaultVisible: true
    opacity: 0.75
    source:
      url: https://geo.ngu.no/mapserver/BerggrunnWMS3
      layer: Berggrunn_sammenstilt_flater
    supportedCrs: [EPSG:3857, EPSG:25832, EPSG:25833, EPSG:25835]
    inspect:
      format: gml
      featureCount: 10
      fields:
        - { path: hovedbergart_tekst, label: { nb: Hovedbergart, en: Main rock type } }
        - { path: tilleggsbergart1_tekst, label: { nb: Tilleggsbergart, en: Additional rock type } }
        - path: { nb: bergartsenhet_tekst, en: bergartsenhet_tekst_engelsk }
          label: { nb: Bergartsenhet, en: Rock unit }
        - {
            path: tektoniskhovedinndeling_tekst,
            label: { nb: Tektonisk hovedinndeling, en: Tectonic domain },
          }
        - { path: tektoniskenhet_tekst, label: { nb: Tektonisk enhet, en: Tectonic unit } }
        - path: dekkekompleks_tekst
          label: { nb: Dekkekompleks, en: Nappe complex }
          href:
            nb: "https://aps.ngu.no/pls/utf8/geoenhet_SokIDb.Vis_enhet?p_spraak=N&p_id={props.dekkekompleks_geninoid}"
            en: "https://aps.ngu.no/pls/utf8/geoenhet_SokIDb.Vis_enhet?p_spraak=E&p_id={props.dekkekompleks_geninoid}"
        - path: dekke_tekst
          label: { nb: Dekke, en: Nappe }
          href:
            nb: "https://aps.ngu.no/pls/utf8/geoenhet_SokIDb.Vis_enhet?p_spraak=N&p_id={props.dekke_geninoid}"
            en: "https://aps.ngu.no/pls/utf8/geoenhet_SokIDb.Vis_enhet?p_spraak=E&p_id={props.dekke_geninoid}"
        - {
            path: dannelsesalder_klassifisering_tekst,
            label: { nb: Dannelsesalder, en: Formation age },
          }
        - { path: dannelsesalder_visning_tekst, label: { nb: Aldersintervall, en: Age interval } }
        - { path: metamorffacies_tekst, label: { nb: Metamorf facies, en: Metamorphic facies } }
        - { path: metamorfalder_tekst, label: { nb: Metamorfosealder, en: Age of metamorphism } }
        - { path: mref_formattert, label: { nb: Kartmålestokk, en: Map scale } }
        - { path: oppdateringsdato, label: { nb: Oppdatert, en: Updated }, format: date }

  - id: bedrock-lines
    type: wms
    category: line
    title:
      nb: Berggrunn – linjer og grenser
      en: Bedrock – lines and boundaries
    group: berggrunn
    defaultVisible: true
    source:
      url: https://geo.ngu.no/mapserver/BerggrunnWMS3
      layer: Berggrunn_sammenstilt_linjer
    supportedCrs: [EPSG:3857, EPSG:25832, EPSG:25833, EPSG:25835]
    inspect:
      format: gml
      featureCount: 10
      fields:
        - { path: objekttype, label: { nb: Objekttype, en: Feature type } }
        - { path: geolkontakttype_tekst, label: { nb: Kontakttype, en: Contact type } }
        - { path: geolpavisningstype_tekst, label: { nb: Påvisningstype, en: Observation type } }
        - { path: mref_formattert, label: { nb: Kartmålestokk, en: Map scale } }
        - { path: oppdateringsdato, label: { nb: Oppdatert, en: Updated }, format: date }

  - id: bedrock-labels
    type: wms
    category: text
    title:
      nb: Berggrunn – tekst
      en: Bedrock – labels
    group: berggrunn
    defaultVisible: true
    source:
      url: https://geo.ngu.no/mapserver/BerggrunnWMS3
      layer: Berggrunn_sammenstilt_tekster
    supportedCrs: [EPSG:3857, EPSG:25832, EPSG:25833, EPSG:25835]
    legendUrl: false # the service returns a blank 45×5 strip for this layer

  - id: deposits-metals
    type: wms
    category: point
    title: { nb: Metallforekomster, en: Metal deposits }
    group: mineralressurser
    defaultVisible: true
    source:
      nb: { url: https://geo.ngu.no/mapserver/MetallerWMS2, layer: Punkt_Metaller }
      en: { url: https://geo.ngu.no/mapserver/MetalsWMS2, layer: Point_Metals }
    supportedCrs: [EPSG:3857, EPSG:25832, EPSG:25833, EPSG:25835]
    inspect:
      format: gml
      featureCount: 10
      fields:
        - path: name
          label: { nb: Navn, en: Name }
          href:
            nb: "https://aps.ngu.no/pls/oradb/minres_deposit_fakta.Main?p_objid={props.okey}&p_spraak=N"
            en: "https://aps.ngu.no/pls/oradb/minres_deposit_fakta.Main?p_objid={props.okey}&p_spraak=E"
        - path: { nb: websub_ntext, en: websub_etext }
          label: { nb: Råstoff, en: Commodity }
        - path: { nb: webcom_ntext, en: webcom_etext }
          label: { nb: Råstoffgruppe, en: Commodity group }
        - { path: mineralregistreringtype, label: { nb: Registreringstype, en: Registration type } }
        - { path: raastoffbetydning, label: { nb: Betydning, en: Significance } }

  - id: drillcores
    type: wms
    category: point
    title: { nb: Borkjerner (metaller), en: Drill cores (metals) }
    group: mineralressurser
    source:
      nb: { url: https://geo.ngu.no/mapserver/MinresKjernerWMS, layer: minres_kjerne_metaller }
      en: { url: https://geo.ngu.no/mapserver/MinresCoresWMS, layer: minres_core_metals }
    supportedCrs: [EPSG:3857, EPSG:25832, EPSG:25833, EPSG:25835]
    inspect:
      format: gml
      featureCount: 10
      fields:
        - { path: borehullsnavn, label: { nb: Borehull, en: Borehole } }
        - { path: lok_navn, label: { nb: Lokalitet, en: Locality } }
        - { path: formal, label: { nb: Formål, en: Purpose } }
        - { path: core_type, label: { nb: Kjernetype, en: Core type } }

  - id: mineral-systems
    type: geojson
    category: plane
    title: { nb: Mineralsystemer, en: Mineral systems }
    group: mineralressurser
    source: { url: /data/mineral_system.json }
    style:
      color: "#7c3aed"
      fillOpacity: 0.2
      strokeWidth: 1.5
    inspect:
      fields:
        - { path: Type, label: { nb: Type, en: Type } }
        - {
            path: MEAN,
            label: { nb: Modellert alder, en: Modelled age },
            format: integer,
            unit: Ma,
          }
        - {
            path: UPb_PointCount,
            label: { nb: U–Pb-dateringer, en: U–Pb datings },
            format: integer,
          }
        - { path: Reason, label: { nb: Vurdering, en: Assessment } }

  - id: mineral-rights
    type: wfs
    category: plane
    title: { nb: Bergrettigheter, en: Mineral rights }
    group: arealtilgang
    defaultVisible: true
    source:
      url: https://wfs.geonorge.no/skwms1/wfs.bergrettigheter
      typeName: app:Bergrettighet
    # Projected only: the service's URN-named default delivers lat/lon.
    supportedCrs: [EPSG:25833, EPSG:25832, EPSG:25835, EPSG:3857]
    style:
      color: "#d97706"
      fillOpacity: 0.15
      strokeWidth: 1.5
    inspect:
      fields:
        - { path: rettighetNavn, label: { nb: Rettighet, en: Right } }
        - { path: rettighetNr, label: { nb: Rettighetsnummer, en: Right number } }
        - { path: rettighetHaver, label: { nb: Rettighetshaver, en: Holder } }
        - { path: mineralType, label: { nb: Mineraler, en: Minerals } }
        - { path: servituttType, label: { nb: Rettighetstype, en: Right type } }
        - { path: innsendtDato, label: { nb: Søkt, en: Applied }, format: date }
        - { path: utstedtDato, label: { nb: Utstedt, en: Issued }, format: date }

  - id: reindeer-grazing
    type: wms
    category: plane
    title: { nb: Reinbeiteområder, en: Reindeer grazing areas }
    group: reindrift
    opacity: 0.7
    source:
      url: https://reindrift.nibio.no/cgi-bin/reindrift
      layer: Reinbeiteomrade
    supportedCrs: [EPSG:3857, EPSG:25832, EPSG:25833, EPSG:25835]
    inspect:
      format: gml
      featureCount: 5
      fields:
        - { path: beskrivelse, label: { nb: Reinbeiteområde, en: Grazing area } }
        - { path: omrkode, label: { nb: Områdekode, en: Area code } }
        - { path: eier, label: { nb: Forvalter, en: Managed by } }
        - { path: areal_daa, label: { nb: Areal, en: Area }, format: integer, unit: daa }
        - { path: oppdateringsdato, label: { nb: Oppdatert, en: Updated }, format: date }

  - id: reindeer-districts
    type: wms
    category: plane
    title: { nb: Reinbeitedistrikter, en: Reindeer grazing districts }
    group: reindrift
    opacity: 0.7
    source:
      url: https://reindrift.nibio.no/cgi-bin/reindrift
      layer: Reinbeitedistrikt
    supportedCrs: [EPSG:3857, EPSG:25832, EPSG:25833, EPSG:25835]
    legendUrl: false
    inspect:
      format: gml
      featureCount: 5
      fields:
        - { path: distriktnavn, label: { nb: Reinbeitedistrikt, en: Grazing district } }
        - { path: distkode, label: { nb: Distriktskode, en: District code } }
        - { path: areal_daa, label: { nb: Areal, en: Area }, format: integer, unit: daa }
        - { path: oppdateringsdato, label: { nb: Oppdatert, en: Updated }, format: date }

  - id: reindeer-restrictions
    type: wms
    category: plane
    title: { nb: Restriksjonsområder, en: Restriction areas }
    group: reindrift
    opacity: 0.7
    source:
      url: https://reindrift.nibio.no/cgi-bin/reindrift
      layer: Restriksjonsomrade
    supportedCrs: [EPSG:3857, EPSG:25832, EPSG:25833, EPSG:25835]
    inspect:
      format: gml
      featureCount: 5
      fields:
        - { path: informasjon, label: { nb: Restriksjon, en: Restriction } }
        - { path: dominstans, label: { nb: Domsinstans, en: Ruling court } }
        - { path: domdato, label: { nb: Domsdato, en: Ruling date }, format: date }
        - { path: domikraft, label: { nb: I kraft, en: In force from }, format: date }
        - { path: oppdateringsdato, label: { nb: Oppdatert, en: Updated }, format: date }

  - id: reindeer-migration-routes
    type: wms
    category: line
    title: { nb: Flyttleier, en: Migration routes }
    group: reindrift
    opacity: 0.7
    source:
      url: https://reindrift.nibio.no/cgi-bin/reindrift
      layer: Flyttlei
    supportedCrs: [EPSG:3857, EPSG:25832, EPSG:25833, EPSG:25835]
    inspect:
      format: gml
      featureCount: 5
      fields:
        - { path: distriktnavn, label: { nb: Reinbeitedistrikt, en: Grazing district } }
        - { path: beitebrukerstreng, label: { nb: Beitebruker, en: Grazing user } }
        - { path: areal_daa, label: { nb: Areal, en: Area }, format: integer, unit: daa }
        - { path: oppdateringsdato, label: { nb: Oppdatert, en: Updated }, format: date }

  - id: reindeer-trails
    type: wms
    category: line
    title: { nb: Trekkleier, en: Movement trails }
    group: reindrift
    opacity: 0.7
    source:
      url: https://reindrift.nibio.no/cgi-bin/reindrift
      layer: Trekklei
    supportedCrs: [EPSG:3857, EPSG:25832, EPSG:25833, EPSG:25835]
    inspect:
      format: gml
      featureCount: 5
      fields:
        - { path: distriktnavn, label: { nb: Reinbeitedistrikt, en: Grazing district } }
        - { path: beitebrukerstreng, label: { nb: Beitebruker, en: Grazing user } }
        - { path: oppdateringsdato, label: { nb: Oppdatert, en: Updated }, format: date }

  - id: reindeer-installations
    type: wms
    category: point
    title: { nb: Anlegg, en: Installations }
    group: reindrift
    opacity: 0.7
    source:
      url: https://reindrift.nibio.no/cgi-bin/reindrift
      layer: Anlegg
    supportedCrs: [EPSG:3857, EPSG:25832, EPSG:25833, EPSG:25835]
    inspect:
      format: gml
      featureCount: 5
      fields:
        - { path: kodenavn, label: { nb: Anleggstype, en: Installation type } }
        - { path: definisjon, label: { nb: Beskrivelse, en: Description } }
        - { path: distriktnavn, label: { nb: Reinbeitedistrikt, en: Grazing district } }
        - { path: beitebrukerstreng, label: { nb: Beitebruker, en: Grazing user } }
        - { path: oppdateringsdato, label: { nb: Oppdatert, en: Updated }, format: date }

panel:
  sections:
    - id: deposits-section
      title: { nb: Forekomster, en: Deposits }
      layers: [deposits-metals]
      compose: table
    - id: drillcores-section
      title: { nb: Borkjerner, en: Drill cores }
      layers: [drillcores]
      compose: table
    - id: bedrock-section
      title: { nb: Berggrunn, en: Bedrock }
      layers: [bedrock-surfaces]
      compose: record
    - id: bedrock-lines-section
      title: { nb: Strukturer og grenser, en: Structures and boundaries }
      layers: [bedrock-lines]
      compose: table
    - id: mineral-rights-section
      title: { nb: Bergrettigheter, en: Mineral rights }
      layers: [mineral-rights]
      compose: table
    - id: reindeer-section
      title: { nb: Reindrift, en: Reindeer husbandry }
      layers:
        [
          reindeer-grazing,
          reindeer-districts,
          reindeer-restrictions,
          reindeer-migration-routes,
          reindeer-trails,
          reindeer-installations,
        ]
      compose: record
    - id: mineral-systems-section
      title: { nb: Mineralsystemer, en: Mineral systems }
      layers: [mineral-systems]
      compose: list
