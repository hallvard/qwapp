# Language model families: a name mapped to an author (the Hugging Face organization)
# and a search term. A family's models are those of the author matching the search
# and the text-generation task. Optional per family:
#   label                 display name (default: the family name)
#   query.<param>=a,b     extra Hugging Face query parameters, e.g. to limit the number of
#                         models. A 'filter' here is added to text-generation, which is always applied.
qwapp.llm.families.llama.author=meta-llama
qwapp.llm.families.llama.search=llama
qwapp.llm.families.llama.label=Llama

qwapp.llm.families.qwen.author=Qwen
qwapp.llm.families.qwen.search=qwen
qwapp.llm.families.qwen.label=Qwen

qwapp.llm.families.gemma.author=google
qwapp.llm.families.gemma.search=gemma
qwapp.llm.families.gemma.label=Gemma

qwapp.llm.families.mistral.author=mistralai
qwapp.llm.families.mistral.search=mistral
qwapp.llm.families.mistral.label=Mistral

qwapp.llm.families.phi.author=microsoft
qwapp.llm.families.phi.search=phi
qwapp.llm.families.phi.label=Phi

qwapp.llm.families.deepseek.author=deepseek-ai
qwapp.llm.families.deepseek.search=deepseek
qwapp.llm.families.deepseek.label=DeepSeek

qwapp.llm.huggingface-url=https://huggingface.co/api
qwapp.llm.cache-ttl=PT10M
